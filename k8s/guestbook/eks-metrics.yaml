apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cloudwatch-dashboard
  namespace: monitoring               # 👈 Recommended from step 2 so Grafana can see it
  labels:
    grafana_dashboard: "1"
  annotations:                        # 👈 FIX: Move this inside the metadata block!
    grafana_folder: "ArgoCD Monitoring"
data:
  argocd-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "title": "ArgoCD Infrastructure Metrics (CloudWatch)",
      "panels": [
        {
          "type": "timeseries",
          "title": "ArgoCD Pods CPU Utilization",
          "id": 1,
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "aws-cloudwatch" },
              "queryMode": "Metrics",
              "expression": "SELECT AVG(pod_cpu_utilization) FROM SCHEMA(\"ContainerInsights\", ClusterName, Namespace, PodName) WHERE Namespace = 'argocd'",
              "id": "A",
              "region": "default"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "ArgoCD Pods Memory Utilization",
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "cloudwatch", "uid": "aws-cloudwatch" },
              "queryMode": "Metrics",
              "expression": "SELECT AVG(pod_memory_utilization) FROM SCHEMA(\"ContainerInsights\", ClusterName, Namespace, PodName) WHERE Namespace = 'argocd'",
              "id": "B",
              "region": "default"
            }
          ]
        }
      ]
    }